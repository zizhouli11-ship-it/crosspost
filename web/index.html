<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨平台发布</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main>
    <h1>跨平台发布</h1>
    <label>标题<input id="title" type="text"></label>
    <label>正文<textarea id="body" rows="6"></textarea></label>
    <label>标签(逗号分隔)<input id="tags" type="text" placeholder="AI, 出海"></label>
    <label>媒体文件路径(每行一个本地路径)
      <textarea id="media" rows="3"
        placeholder="C:\path\a.jpg&#10;C:\path\v.mp4"></textarea>
    </label>
    <fieldset>
      <legend>平台</legend>
      <div id="platforms"></div>
    </fieldset>
    <div class="actions">
      <button id="validate">校验</button>
      <button id="publish">发布</button>
    </div>
    <section id="results"></section>

    <details class="settings">
      <summary>设置 / 连接账号</summary>
      <div class="card">
        <h2>X (Twitter) API 密钥</h2>
        <label>API Key<input id="x_api_key" type="text"></label>
        <label>API Secret<input id="x_api_secret" type="text"></label>
        <label>Access Token<input id="x_access_token" type="text"></label>
        <label>Access Token Secret<input id="x_access_token_secret" type="text"></label>
        <button id="save_x">保存 X 密钥</button>
        <span id="x_save_msg" class="msg"></span>
      </div>
      <div class="card">
        <h2>YouTube 授权</h2>
        <p class="msg">先把 Google 下载的 client secret 放到
          config/youtube_client_secret.json,再点下面按钮(会打开浏览器授权)。</p>
        <button id="auth_yt">连接 YouTube</button>
        <span id="yt_auth_msg" class="msg"></span>
      </div>
    </details>
  </main>
  <script src="/web/app.js"></script>
</body>
</html>
